<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="system-ui, Segoe UI, Arial, sans-serif" font-size="13">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d1b18"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b4441c"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d5a80"/></marker></defs>
<rect width="760" height="400" rx="10" fill="#fdfbf7" stroke="#d9d3c5"/>
<text x="380" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1d1b18">Dos formas de atacar al GNSS</text>
<line x1="380" y1="48" x2="380" y2="380" stroke="#d9d3c5" stroke-dasharray="5 4"/>
<text x="190" y="62" text-anchor="middle" font-weight="600" fill="#b4441c" font-size="15">Jamming: tapar la señal</text>
<g transform="translate(90,100)"><rect x="-9" y="-6" width="18" height="12" rx="2" fill="#3d5a80"/><rect x="-24" y="-4" width="12" height="8" fill="#3d5a80" opacity=".7"/><rect x="12" y="-4" width="12" height="8" fill="#3d5a80" opacity=".7"/></g>
<line x1="90" y1="112" x2="170" y2="262" stroke="#3d5a80" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#c)"/>
<g transform="translate(190,100)"><rect x="-9" y="-6" width="18" height="12" rx="2" fill="#3d5a80"/><rect x="-24" y="-4" width="12" height="8" fill="#3d5a80" opacity=".7"/><rect x="12" y="-4" width="12" height="8" fill="#3d5a80" opacity=".7"/></g>
<line x1="190" y1="112" x2="190" y2="262" stroke="#3d5a80" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#c)"/>
<g transform="translate(290,100)"><rect x="-9" y="-6" width="18" height="12" rx="2" fill="#3d5a80"/><rect x="-24" y="-4" width="12" height="8" fill="#3d5a80" opacity=".7"/><rect x="12" y="-4" width="12" height="8" fill="#3d5a80" opacity=".7"/></g>
<line x1="290" y1="112" x2="210" y2="262" stroke="#3d5a80" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#c)"/>
<rect x="120" y="275" width="140" height="44" rx="6" fill="#dde6f0" stroke="#3d5a80" stroke-width="1.5"/><text x="190" y="294" text-anchor="middle" font-weight="600" fill="#1d1b18">Receptor del UAV</text><text x="190" y="310" text-anchor="middle" font-size="11" fill="#6b665d">no puede enganchar</text>
<rect x="20" y="215" width="86" height="36" rx="6" fill="#f0dcd2" stroke="#b4441c" stroke-width="1.5"/><text x="63" y="238" text-anchor="middle" font-weight="600" fill="#1d1b18">Jammer</text>
<path d="M 106 233 Q 160 225 160 275" fill="none" stroke="#b4441c" stroke-width="2.4" marker-end="url(#b)"/>
<text x="190" y="350" text-anchor="middle" font-size="12.5" fill="#1d1b18">Mete ruido en la banda: el receptor se queda ciego.</text>
<text x="190" y="368" text-anchor="middle" font-size="12" fill="#6b665d">Se nota enseguida.</text>
<text x="570" y="62" text-anchor="middle" font-weight="600" fill="#b4441c" font-size="15">Spoofing: reemplazar la señal</text>
<g transform="translate(470,100)"><rect x="-9" y="-6" width="18" height="12" rx="2" fill="#3d5a80"/><rect x="-24" y="-4" width="12" height="8" fill="#3d5a80" opacity=".7"/><rect x="12" y="-4" width="12" height="8" fill="#3d5a80" opacity=".7"/></g>
<line x1="470" y1="112" x2="550" y2="262" stroke="#3d5a80" stroke-width="1.6" stroke-dasharray="5 4"/>
<g transform="translate(570,100)"><rect x="-9" y="-6" width="18" height="12" rx="2" fill="#3d5a80"/><rect x="-24" y="-4" width="12" height="8" fill="#3d5a80" opacity=".7"/><rect x="12" y="-4" width="12" height="8" fill="#3d5a80" opacity=".7"/></g>
<line x1="570" y1="112" x2="570" y2="262" stroke="#3d5a80" stroke-width="1.6" stroke-dasharray="5 4"/>
<g transform="translate(670,100)"><rect x="-9" y="-6" width="18" height="12" rx="2" fill="#3d5a80"/><rect x="-24" y="-4" width="12" height="8" fill="#3d5a80" opacity=".7"/><rect x="12" y="-4" width="12" height="8" fill="#3d5a80" opacity=".7"/></g>
<line x1="670" y1="112" x2="590" y2="262" stroke="#3d5a80" stroke-width="1.6" stroke-dasharray="5 4"/>
<rect x="500" y="275" width="140" height="44" rx="6" fill="#dde6f0" stroke="#3d5a80" stroke-width="1.5"/><text x="570" y="294" text-anchor="middle" font-weight="600" fill="#1d1b18">Receptor del UAV</text><text x="570" y="310" text-anchor="middle" font-size="11" fill="#6b665d">calcula una posición falsa</text>
<rect x="400" y="215" width="86" height="36" rx="6" fill="#f0dcd2" stroke="#b4441c" stroke-width="1.5"/><text x="443" y="238" text-anchor="middle" font-weight="600" fill="#1d1b18">Spoofer</text>
<path d="M 486 233 Q 540 225 540 275" fill="none" stroke="#b4441c" stroke-width="2.4" marker-end="url(#b)"/>
<text x="570" y="350" text-anchor="middle" font-size="12.5" fill="#1d1b18">Manda señales falsas que el receptor acepta como reales.</text>
<text x="570" y="368" text-anchor="middle" font-size="12" fill="#6b665d">No avisa: el UAV sigue "funcionando".</text>
</svg>