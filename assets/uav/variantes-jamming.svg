<text x="44" y="302" font-size="11" fill="#6b665d">frecuencia ↑</text><text x="338" y="402" text-anchor="end" font-size="11" fill="#6b665d">tiempo →</text>
<rect x="400" y="238" width="340" height="170" rx="8" fill="#fdfbf7" stroke="#d9d3c5"/>
<text x="414" y="260" font-weight="600" fill="#1d1b18">Pulsado</text>
<text x="414" y="278" font-size="11.5" fill="#6b665d">Ráfagas fuertes y cortas para saturar el AGC del receptor</text>
