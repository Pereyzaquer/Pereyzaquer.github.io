<rect x="514" y="308" width="14" height="80" fill="#f0dcd2" stroke="#b4441c" stroke-width="1.6"/>
<rect x="582" y="308" width="14" height="80" fill="#f0dcd2" stroke="#b4441c" stroke-width="1.6"/>
