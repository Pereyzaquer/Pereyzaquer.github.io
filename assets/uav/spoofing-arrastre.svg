<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="system-ui, Segoe UI, Arial, sans-serif" font-size="13">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d1b18"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b4441c"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d5a80"/></marker></defs>
<rect width="760" height="400" rx="10" fill="#fdfbf7" stroke="#d9d3c5"/>
<text x="380" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1d1b18">Spoofing sincronizado: el arrastre suave</text>
<text x="30" y="66" font-weight="600" fill="#1d1b18">1. Solo la señal real</text>
<line x1="60" y1="150" x2="720" y2="150" stroke="#1d1b18" stroke-width="1.2"/>
<path d="M 275 150 L 330 60 L 385 150" fill="none" stroke="#3d5a80" stroke-width="2.6"/>
<text x="30" y="176" font-weight="600" fill="#1d1b18">2. El spoofer se alinea y sube un poco la potencia</text>
<line x1="60" y1="260" x2="720" y2="260" stroke="#1d1b18" stroke-width="1.2"/>
<path d="M 275 260 L 330 185 L 385 260" fill="none" stroke="#3d5a80" stroke-width="2.6"/>
<path d="M 275 260 L 330 160 L 385 260" fill="none" stroke="#b4441c" stroke-width="2.6" stroke-dasharray="7 4"/>
<text x="30" y="286" font-weight="600" fill="#1d1b18">3. Arrastra el pico falso</text>
<line x1="60" y1="370" x2="720" y2="370" stroke="#1d1b18" stroke-width="1.2"/>
<path d="M 275 370 L 330 315 L 385 370" fill="none" stroke="#3d5a80" stroke-width="2.6"/>
<path d="M 345 370 L 400 265 L 455 370" fill="none" stroke="#b4441c" stroke-width="2.6" stroke-dasharray="7 4"/>
<line x1="330" y1="330" x2="400" y2="330" stroke="#b4441c" stroke-width="1.6" marker-end="url(#b)"/>
<text x="414" y="334" font-size="12" fill="#b4441c">el receptor sigue al pico más fuerte</text>
<line x1="60" y1="395" x2="60" y2="395"/>
<rect x="520" y="52" width="210" height="34" rx="6" fill="#ece7db"/><text x="625" y="68" text-anchor="middle" font-size="12" fill="#1d1b18"><tspan fill="#3d5a80" font-weight="600">— señal real</tspan> · <tspan fill="#b4441c" font-weight="600">- - señal falsa</tspan></text><text x="625" y="82" text-anchor="middle" font-size="11" fill="#6b665d">picos de correlación del código</text>
<text x="380" y="392" text-anchor="middle" font-size="12" fill="#1d1b18">Sin saltos y sin alarmas: la posición se corre de a poco hacia donde el atacante quiere.</text>
</svg>