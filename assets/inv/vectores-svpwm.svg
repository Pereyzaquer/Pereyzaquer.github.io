<g font-size="12.5" fill="#1d1b18">
<text x="36" y="492" font-weight="600">Vref = (T1/Ts)·V1 + (T2/Ts)·V2 + (T0/Ts)·V0</text>
<text x="36" y="512">T1 = √3·Ts·|Vref|/Vdc · sen(60° − α)</text>
<text x="36" y="530">T2 = √3·Ts·|Vref|/Vdc · sen(α)          T0 = Ts − T1 − T2</text>
<text x="36" y="554" fill="#6b665d">El caso más exigente es α = 30°: ahí T1 + T2 = Ts define el límite |Vref| ≤ Vdc/√3.</text>
