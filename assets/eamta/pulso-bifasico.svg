<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="system-ui, Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d1b18"/></marker>
  </defs>
  <rect width="760" height="330" rx="10" fill="#fdfbf7" stroke="#d9d3c5"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1d1b18">Pulso bifásico con carga neutra</text>

  <!-- axes -->
  <line x1="60" y1="180" x2="720" y2="180" stroke="#1d1b18" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="60" y1="260" x2="60" y2="50" stroke="#1d1b18" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="716" y="200" text-anchor="end" fill="#6b665d">tiempo</text>
  <text x="70" y="60" fill="#6b665d">corriente</text>

  <!-- pulse: positive tall short, negative low long (equal area) -->
  <path d="M 60 180 L 130 180 L 130 90 L 210 90 L 210 180 L 250 180 L 250 215 L 490 215 L 490 180 L 720 180"
        fill="none" stroke="#b4441c" stroke-width="2.8"/>
  <rect x="130" y="90" width="80" height="90" fill="#f0dcd2" opacity=".8"/>
  <rect x="250" y="180" width="240" height="35" fill="#dde6f0" opacity=".9"/>
  <text x="170" y="140" text-anchor="middle" font-weight="600" fill="#b4441c">Q+</text>
  <text x="370" y="203" text-anchor="middle" font-weight="600" fill="#3d5a80">Q−</text>

  <text x="170" y="78" text-anchor="middle" font-size="12" fill="#1d1b18">fase de estimulación</text>
  <text x="370" y="240" text-anchor="middle" font-size="12" fill="#1d1b18">fase de recuperación (más suave y más larga)</text>

  <!-- blanking -->
  <rect x="520" y="76" width="190" height="72" rx="6" fill="#ece7db" stroke="#6b665d" stroke-dasharray="5 4"/>
  <text x="615" y="98" text-anchor="middle" font-weight="600" fill="#1d1b18">Blanking</text>
  <text x="615" y="117" text-anchor="middle" font-size="12" fill="#1d1b18">el electrodo se lleva a una</text>
  <text x="615" y="133" text-anchor="middle" font-size="12" fill="#1d1b18">tensión conocida y se descarga</text>

  <text x="380" y="290" text-anchor="middle" font-size="12.5" fill="#1d1b18">Las áreas de Q+ y Q− son iguales: la carga que se manda es la misma que se recupera.</text>
  <text x="380" y="310" text-anchor="middle" font-size="11.5" fill="#6b665d">Esquema conceptual, sin escalas reales.</text>
</svg>
